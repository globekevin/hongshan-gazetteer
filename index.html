<style>

  .hint em:after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:#2a0c08}

  .copy>*{opacity:0;transform:translateY(14px);animation:rise 1.1s ease forwards}

  @keyframes rise{to{opacity:1;transform:none}}

    .copy{left:6vw;top:auto;bottom:90px;transform:none;padding:18px 18px 22px;background:rgba(255,248,232,.62);backdrop-filter:blur(8px);border-radius:18px}
    .topnav{display:none}.hint{display:none}.foot{left:6vw;right:6vw;bottom:14px;font-size:11px}
    .copy p{font-size:15px}
  }
</style>
