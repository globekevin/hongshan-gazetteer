<title>洪山 · 一株菜薹里的区志</title>
<meta name="description" content="以一只瓢虫的视角走进洪山菜薹林，读懂《洪山区志》里的山水、物产、人物与风俗。">
<link rel="stylesheet" href="assets/css/site.css?v=1124g">
<style>
  html,body{height:100%;overflow:hidden;background:#efe6cf}
  .sky{position:fixed;inset:0;background:
      radial-gradient(60vmax 50vmax at 80% 12%, rgba(255,248,222,.95), rgba(255,240,200,.35) 40%, rgba(255,240,200,0) 70%),
      linear-gradient(180deg,#bcd7df 0%,#d9e4d9 32%,#f1e8cc 64%,#e6d7b2 100%);}
  .rays{position:fixed;inset:-20%;background:repeating-conic-gradient(from 200deg at 82% 8%, rgba(255,250,225,.12) 0 4deg, rgba(255,250,225,0) 4deg 11deg);
        mask-image:radial-gradient(circle at 82% 8%, #000 0, rgba(0,0,0,.4) 35%, transparent 65%);-webkit-mask-image:radial-gradient(circle at 82% 8%, #000 0, rgba(0,0,0,.4) 35%, transparent 65%);
        animation:rayspin 90s linear infinite;pointer-events:none}
  @keyframes rayspin{to{transform:rotate(8deg)}}
  canvas{position:fixed;left:0;top:0;will-change:transform}
  #cv-far{filter:blur(2.6px) saturate(.85);opacity:.9}
  #cv-back{filter:blur(1.3px) saturate(.9)}
  #cv-near{filter:blur(10px);opacity:.7}
  #cv-fx{pointer-events:none}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 45% 45%, rgba(0,0,0,0) 55%, rgba(40,20,30,.28) 100%)}
  .copy{position:fixed;left:7vw;top:50%;transform:translateY(-52%);z-index:5;max-width:min(600px,80vw);color:#2b1a24}
  .copy .loc{font-size:13px;letter-spacing:.5em;color:#7a2f5c;display:flex;align-items:center;gap:12px}
  .copy .loc:before{content:"";width:34px;height:1px;background:#7a2f5c}
  .copy h1{font-family:var(--kai);font-weight:400;font-size:clamp(84px,11vw,170px);line-height:1;margin:.12em 0 .02em;letter-spacing:.06em;
     color:#2a1220;text-shadow:0 2px 30px rgba(255,248,225,.8)}
  .copy h1 span{display:inline-block;animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
  .copy h1 span:nth-child(2){animation-delay:-2.2s}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
  .copy .en{font-size:12px;letter-spacing:.9em;color:#6c5560;margin-bottom:26px}
  .copy p{font-family:var(--song);font-size:17px;line-height:2;color:#3d2a33;margin:0;text-shadow:0 1px 12px rgba(255,248,230,.9)}
  .cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .btn-main{display:inline-flex;align-items:center;gap:14px;padding:15px 34px;border-radius:999px;background:#7a2f5c;color:#fff8ea;text-decoration:none;
     font-size:17px;letter-spacing:.5em;box-shadow:0 10px 30px rgba(122,47,92,.35);transition:.35s}
  .btn-main:hover{background:#5e1f45;transform:translateY(-2px);letter-spacing:.6em}
  .btn-main i{font-style:normal;letter-spacing:0;transition:.35s}
  .btn-main:hover i{transform:translateX(5px)}
  .btn-ghost{padding:13px 22px;border-radius:999px;border:1px solid rgba(122,47,92,.45);color:#5e1f45;text-decoration:none;font-size:14px;letter-spacing:.2em;background:#fdf5e2;transition:.3s}
  .btn-ghost:hover{background:#fff8ea}
  .topnav{position:fixed;right:3vw;top:22px;z-index:6;display:flex;gap:24px;padding:10px 24px}
  .topnav a{color:#24121c;font-weight:600;text-decoration:none;font-size:14px;letter-spacing:.25em;position:relative;text-shadow:0 0 3px rgba(255,250,236,.95),0 0 9px rgba(255,250,236,.9),0 0 18px rgba(255,250,236,.7)}
  .topnav a:after{content:"";position:absolute;left:0;right:.25em;bottom:-6px;height:1px;background:#7a2f5c;transform:scaleX(0);transition:.3s;transform-origin:left}
  .topnav a:hover:after{transform:scaleX(1)}
  .brand{position:fixed;left:4vw;top:18px;z-index:6;display:flex;align-items:flex-end;gap:10px;text-decoration:none;color:#2b1a24}
  .brand b{font-family:var(--kai);font-weight:400;font-size:20px;letter-spacing:.2em;margin-bottom:12px}
  .foot{position:fixed;left:7vw;bottom:22px;z-index:6;font-size:12px;color:#fff6e2;letter-spacing:.12em;text-shadow:0 0 3px rgba(30,14,24,.95),0 0 8px rgba(30,14,24,.85),0 0 16px rgba(30,14,24,.6)}
  .hint{position:fixed;right:4vw;bottom:22px;z-index:6;font-size:12px;color:#fff6e2;letter-spacing:.2em;display:flex;align-items:center;gap:8px;text-shadow:0 0 3px rgba(30,14,24,.95),0 0 8px rgba(30,14,24,.85),0 0 16px rgba(30,14,24,.6)}
  .hint em{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6a4a,#c41e14);position:relative}
  .hint em:after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:#2a0c08}
  .intro-veil{position:fixed;inset:0;background:#f3ead4;z-index:20;pointer-events:none;animation:veil 1.6s .2s ease forwards}
  @keyframes veil{to{opacity:0}}
  .copy>*{opacity:0;transform:translateY(14px);animation:rise 1.1s ease forwards}
  .copy .loc{animation-delay:.9s}.copy h1{animation-delay:1.1s}.copy .en{animation-delay:1.35s}.copy p{animation-delay:1.6s}.copy .cta{animation-delay:1.9s}
  @keyframes rise{to{opacity:1;transform:none}}
  .copy p{color:#24121c;font-weight:600;text-shadow:0 0 3px rgba(255,250,236,.95),0 0 10px rgba(255,250,236,.9),0 0 22px rgba(255,250,236,.7)}
  .copy .en{color:#4a3340;text-shadow:0 0 6px rgba(255,250,236,.9)}
  .copy .loc{color:#5e1f45;font-weight:600;text-shadow:0 0 3px rgba(255,250,236,.95),0 0 10px rgba(255,250,236,.9)}
  .mnav{display:none}
  @media (max-width:760px),(max-width:900px) and (orientation:portrait){
    /* 手机：改成可滚动的竖向文档流，按钮和出处永远拿得到 */
    html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
    body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    .brand{position:absolute;left:5vw;top:max(12px,env(safe-area-inset-top))}
    .brand b{font-size:18px;margin-bottom:9px}
    .mnav{display:flex;position:relative;z-index:6;gap:6px;overflow-x:auto;scrollbar-width:none;margin:calc(82px + env(safe-area-inset-top)) 0 0;padding:0 5vw 4px}
    .mnav::-webkit-scrollbar{display:none}
    .mnav a{flex:none;font-size:14px;letter-spacing:.12em;color:#3a2230;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid rgba(122,47,92,.3);background:#fdf5e2}
    .copy{position:relative;left:auto;top:auto;bottom:auto;transform:none;max-width:none;margin:0;padding:18px 7vw 0;display:flex;flex-direction:column}
    .copy .loc{order:1}.copy h1{order:2}.copy .en{order:3}.copy .cta{order:4}.copy p{order:5;margin-top:18px}
    .copy .loc{font-size:12px;letter-spacing:.4em}
    .copy h1{font-size:min(19vw,88px);margin:.1em 0 0;white-space:nowrap}
    .copy .en{margin-bottom:12px}
    .copy p{font-size:15px;line-height:1.8;padding:10px 12px;margin-left:-12px;margin-right:-12px;border-radius:12px;background:rgba(253,245,226,.55)}
    .cta{margin-top:16px;gap:10px;flex-wrap:wrap}
    .btn-main{padding:0 26px;height:46px;font-size:16px;white-space:nowrap;letter-spacing:.4em}
    .btn-ghost{padding:0 16px;height:46px;display:inline-flex;align-items:center;white-space:nowrap;font-size:14px;letter-spacing:.1em}
    .topnav{display:none}.hint{display:none}
    .foot{position:relative;left:auto;right:auto;bottom:auto;margin:28px 7vw 0;padding-bottom:calc(22px + env(safe-area-inset-bottom));font-size:12px;line-height:1.7}
    .copy>*{animation-duration:.8s}
    .copy .loc{animation-delay:.5s}.copy h1{animation-delay:.6s}.copy .en{animation-delay:.7s}.copy p{animation-delay:.8s}.copy .cta{animation-delay:.9s}
  }
  /* 屏幕较矮（如微信内置浏览器、大字体）：压缩间距，尽量让按钮留在第一屏 */
  @media (max-width:760px) and (max-height:700px),(max-width:900px) and (orientation:portrait) and (max-height:700px){
    .mnav{margin-top:calc(70px + env(safe-area-inset-top))}
    .copy{padding-top:10px}
    .copy h1{font-size:min(15vw,70px)}
    .copy p{font-size:14px;line-height:1.7}
    .cta{margin-top:12px}
  }
</style>
